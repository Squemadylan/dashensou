[project]
name = "dashensou-scraper"
version = "0.1.0"
description = "Multi-source pan-search scraper for dashensou — uses Scrapling's Fetcher + Selector only (no Spider / Feed Export)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # 只用解析器 + 三个 fetcher，不装 ai / shell extras
    # 加 ai: "scrapling[ai]"
    # 加 shell: "scrapling[shell]"
    "scrapling[fetchers]>=0.3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
dashensou-scraper = "dashensou_scraper.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashensou_scraper"]
