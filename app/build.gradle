plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// 读取 local.properties 的工具方法（须在 android{} 之前定义，否则 defaultConfig 内调用找不到）
ext.localProps = { key, defaultValue ->
    def props = new Properties()
    def file = rootProject.file("local.properties")
    if (file.exists()) {
        file.withInputStream { props.load(it) }
    }
    return props.getProperty(key, defaultValue ?: "")
}

android {
    namespace 'com.dashensou.app'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.dashensou.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "UPDATE_MANIFEST_URL",
                "\"https://raw.githubusercontent.com/Squemadylan/dashensou/master/app/update.json\""
        buildConfigField "String", "UPDATE_MANIFEST_URL_MIRROR",
                "\"https://cdn.jsdelivr.net/gh/Squemadylan/dashensou@master/app/update.json\""

        // GitHub PAT / 钉钉机器人密钥从 local.properties 注入，避免硬编码进仓库被 GitHub 吊销
        buildConfigField "String", "GITHUB_PAT", "\"${localProps("github.pat", "")}\""
        buildConfigField "String", "DINGTALK_WEBHOOK", "\"${localProps("dingtalk.webhook", "")}\""
        buildConfigField "String", "DINGTALK_SECRET", "\"${localProps("dingtalk.secret", "")}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
            debuggable true
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/LICENSE*',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE*',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module',
                    'META-INF/DEPENDENCIES',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    ksp 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
